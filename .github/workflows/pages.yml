name: Build, deploy, and smoke test

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build catalog and deploy to Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Build plugins.jsonld
        run: bun run scripts/build-jsonld.ts

      - name: Assemble site
        run: |
          cp web/index.html site/
          cp plugins/*.toml site/
          touch site/.nojekyll
          ls -la site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke-test:
    name: Smoke test hosted plugins
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install proto
        run: |
          curl -fsSL https://moonrepo.dev/install/proto.sh | bash -s -- --yes
          echo "$HOME/.proto/bin" >> "$GITHUB_PATH"
          echo "$HOME/.proto/shims" >> "$GITHUB_PATH"

      - name: Generate .prototools.test
        run: bun run scripts/build-prototools.ts

      - name: Wait for Pages to be reachable
        run: |
          url="${{ needs.build-and-deploy.outputs.page_url }}plugins.jsonld"
          [ -z "$url" ] && url="https://tomdavidson.github.io/proto/plugins.jsonld"
          echo "polling $url"
          for i in $(seq 1 30); do
            if curl -fsSL -o /dev/null "$url"; then
              echo "site is live"
              exit 0
            fi
            echo "attempt $i: not ready, sleeping 10s"
            sleep 10
          done
          echo "site never came up"
          exit 1

      - name: Verify every plugin TOML is fetchable
        run: |
          base="https://tomdavidson.github.io/proto"
          fail=0
          for toml in plugins/*.toml; do
            id="$(basename "$toml" .toml)"
            url="${base}/${id}.toml"
            if curl -fsSL --retry 3 --retry-delay 3 -o /dev/null "$url"; then
              echo "ok   $id"
            else
              echo "FAIL $id  $url"
              fail=1
            fi
          done
          exit $fail

      - name: Install all plugins in a sandbox
        run: |
          mkdir -p /tmp/proto-smoke
          cp .prototools.test /tmp/proto-smoke/.prototools
          cd /tmp/proto-smoke
          cat .prototools
          proto install --all

      - name: List installed plugins
        run: |
          cd /tmp/proto-smoke
          proto list
