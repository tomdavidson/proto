<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>proto plugins — tomdavidson</title>
  <meta name="description" content="TOML schema plugins for proto">
  <link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root, [data-theme="light"] {
      --bg: #f7f6f2;
      --surface: #f9f8f5;
      --surface-offset: #f3f0ec;
      --text: #28251d;
      --text-muted: #7a7974;
      --text-faint: #bab9b4;
      --accent: #01696f;
      --accent-hover: #0c4e54;
      --border: #d4d1ca;
      --divider: #dcd9d5;
      --r-sm: 0.375rem;
      --r-md: 0.5rem;
      --font-body: 'General Sans', 'Helvetica Neue', sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
    }
    [data-theme="dark"] {
      --bg: #171614;
      --surface: #1c1b19;
      --surface-offset: #22211f;
      --text: #cdccca;
      --text-muted: #797876;
      --text-faint: #5a5957;
      --accent: #4f98a3;
      --accent-hover: #6cb5bf;
      --border: #393836;
      --divider: #2d2c2a;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    body {
      min-height: 100dvh;
      font-family: var(--font-body);
      font-size: clamp(1rem, .95rem + .25vw, 1.125rem);
      line-height: 1.6;
      color: var(--text);
      background: var(--bg);
      padding: 2rem 1rem 3rem;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-hover); text-decoration: underline; }
    .wrap { max-width: 760px; margin: 0 auto; }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    h1 {
      font-size: clamp(1.25rem, 1rem + 1vw, 1.75rem);
      font-weight: 600;
      line-height: 1.2;
    }
    h1 .sep { color: var(--text-faint); font-weight: 400; margin: 0 .25rem; }
    h1 .owner { color: var(--text-muted); font-weight: 400; }
    .sub {
      color: var(--text-muted);
      font-size: .875rem;
      margin-top: .25rem;
    }
    .theme-btn {
      cursor: pointer;
      background: none;
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      padding: .5rem;
      color: var(--text-muted);
      transition: color .18s, border-color .18s;
      flex-shrink: 0;
    }
    .theme-btn:hover { color: var(--text); border-color: var(--text-muted); }

    .catalog-meta {
      font-size: .75rem;
      color: var(--text-faint);
      margin-bottom: 1.5rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: 1rem 1.25rem;
      margin-bottom: .75rem;
      transition: border-color .18s;
    }
    .card:hover { border-color: var(--accent); }

    .card-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: .5rem;
      margin-bottom: .25rem;
      flex-wrap: wrap;
    }
    .card-title { display: flex; align-items: baseline; gap: .5rem; }
    .card-name { font-weight: 600; font-size: 1rem; color: var(--text); }
    .card-id {
      font-family: var(--font-mono);
      font-size: .75rem;
      color: var(--text-faint);
    }
    .card-meta {
      display: flex;
      gap: .5rem;
      flex-wrap: wrap;
    }
    .tag {
      font-size: .7rem;
      font-family: var(--font-mono);
      padding: .15rem .4rem;
      border-radius: var(--r-sm);
      background: var(--surface-offset);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }
    .card-desc {
      color: var(--text-muted);
      font-size: .875rem;
      margin: .25rem 0 .75rem;
    }
    .card-desc:empty { display: none; }

    .cmd-row {
      display: flex;
      align-items: center;
      gap: .5rem;
      background: var(--surface-offset);
      border-radius: var(--r-sm);
      padding: .5rem .75rem;
      font-family: var(--font-mono);
      font-size: .8rem;
      line-height: 1.4;
      color: var(--text);
      overflow-x: auto;
    }
    .cmd-row code { flex: 1; white-space: nowrap; }
    .copy-btn {
      cursor: pointer;
      background: none;
      border: none;
      color: var(--text-faint);
      padding: .25rem;
      border-radius: var(--r-sm);
      flex-shrink: 0;
      transition: color .18s;
    }
    .copy-btn:hover { color: var(--accent); }
    .copy-btn.copied { color: var(--accent); }

    .toml-link {
      display: inline-block;
      margin-top: .5rem;
      font-family: var(--font-mono);
      font-size: .75rem;
      color: var(--text-faint);
    }
    .toml-link:hover { color: var(--accent); }

    footer {
      margin-top: 2.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--divider);
      font-size: .8rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    #loading, #error {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
    }
    #error { color: #a13544; }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
      border-radius: var(--r-sm);
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>proto plugins <span class="sep">/</span><span class="owner">tomdavidson</span></h1>
        <p class="sub">TOML schema plugins for <a href="https://moonrepo.dev/proto" target="_blank" rel="noopener noreferrer">proto</a></p>
      </div>
      <button class="theme-btn" data-theme-toggle aria-label="Toggle theme">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </header>

    <div id="catalog-meta" class="catalog-meta"></div>
    <div id="loading">Loading catalog…</div>
    <div id="error" hidden></div>
    <main id="plugins"></main>

    <footer>
      <span>
        <a href="./plugins.jsonld">plugins.jsonld</a>
        · <a href="https://github.com/tomdavidson/proto" target="_blank" rel="noopener noreferrer">source</a>
      </span>
      <span id="catalog-date"></span>
    </footer>
  </div>

  <script type="module">
    const iconCopy = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>'
    const iconCheck = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'
    const iconSun = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>'
    const iconMoon = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>'

    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]))

    const pluginsEl = document.getElementById('plugins')
    const loadingEl = document.getElementById('loading')
    const errorEl = document.getElementById('error')
    const metaEl = document.getElementById('catalog-meta')
    const dateEl = document.getElementById('catalog-date')

    const renderPlugin = p => `
      <article class="card">
        <div class="card-head">
          <div class="card-title">
            <span class="card-name">${esc(p.name)}</span>
            <span class="card-id">${esc(p.identifier)}</span>
          </div>
          <div class="card-meta">
            ${p.pluginType ? `<span class="tag">${esc(p.pluginType)}</span>` : ''}
            ${(p.operatingSystem || []).map(os => `<span class="tag">${esc(os)}</span>`).join('')}
          </div>
        </div>
        <p class="card-desc">${esc(p.description)}</p>
        <div class="cmd-row">
          <code>${esc(p.addCommand)}</code>
          <button class="copy-btn" type="button" data-cmd="${esc(p.addCommand)}" aria-label="Copy command for ${esc(p.identifier)}">${iconCopy}</button>
        </div>
        <a class="toml-link" href="${esc(p.downloadUrl)}" target="_blank" rel="noopener noreferrer">${esc(p.identifier)}.toml</a>
      </article>
    `

    const wireCopyButtons = () => {
      pluginsEl.querySelectorAll('.copy-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(btn.dataset.cmd)
            btn.classList.add('copied')
            btn.innerHTML = iconCheck
            setTimeout(() => {
              btn.classList.remove('copied')
              btn.innerHTML = iconCopy
            }, 1500)
          } catch (_) {}
        })
      })
    }

    const load = async () => {
      try {
        const res = await fetch('./plugins.jsonld')
        if (!res.ok) throw new Error(`${res.status} ${res.statusText}`)
        const feed = await res.json()
        const plugins = feed.member || feed.plugins || feed.dataFeedElement || []

        loadingEl.hidden = true
        metaEl.textContent = `${plugins.length} plugin${plugins.length === 1 ? '' : 's'}`
        if (feed.dateModified) {
          dateEl.textContent = `updated ${new Date(feed.dateModified).toISOString().slice(0, 10)}`
        }

        pluginsEl.innerHTML = plugins.map(renderPlugin).join('')
        wireCopyButtons()
      } catch (e) {
        loadingEl.hidden = true
        errorEl.hidden = false
        errorEl.textContent = `Failed to load plugins.jsonld: ${e.message}`
      }
    }

    // Theme toggle
    ;(() => {
      const t = document.querySelector('[data-theme-toggle]')
      const r = document.documentElement
      let d = matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light'
      r.setAttribute('data-theme', d)
      t.addEventListener('click', () => {
        d = d === 'dark' ? 'light' : 'dark'
        r.setAttribute('data-theme', d)
        t.innerHTML = d === 'dark' ? iconSun : iconMoon
        t.setAttribute('aria-label', `Switch to ${d === 'dark' ? 'light' : 'dark'} mode`)
      })
    })()

    load()
  </script>
</body>
</html>
