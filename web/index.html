<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>proto plugins — tomdavidson</title>
  <meta name="description" content="TOML schema plugins for proto">
  <style>
    :root {
      --bg: #171614;
      --surface: #1c1b19;
      --surface-offset: #22211f;
      --text: #cdccca;
      --text-muted: #979592;
      --text-faint: #6f6d6a;
      --accent: #4f98a3;
      --accent-hover: #6cb5bf;
      --border: #393836;
      --divider: #2d2c2a;
      --danger: #dd6974;
      --r-sm: 0.375rem;
      --r-md: 0.5rem;
      --font-body: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif;
      --font-mono: ui-monospace, "SFMono-Regular", "Cascadia Code", "Source Code Pro", Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.22);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-size-adjust: none;
    }

    body {
      min-height: 100dvh;
      font-family: var(--font-body);
      font-size: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
      line-height: 1.6;
      color: var(--text);
      background: var(--bg);
      padding: 2rem 1rem 3rem;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      color: var(--accent-hover);
      text-decoration: underline;
    }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: clamp(1.25rem, 1rem + 1vw, 1.75rem);
      font-weight: 650;
      line-height: 1.2;
      letter-spacing: -0.01em;
    }

    h1 .sep {
      color: var(--text-faint);
      font-weight: 450;
      margin: 0 0.25rem;
    }

    h1 .owner {
      color: var(--text-muted);
      font-weight: 450;
    }

    .sub {
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-top: 0.25rem;
      max-width: 64ch;
    }

    .catalog-meta {
      font-size: 0.75rem;
      color: var(--text-faint);
      margin-bottom: 1.5rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: 1rem 1.25rem;
      margin-bottom: 0.75rem;
      transition: border-color 180ms ease, transform 180ms ease;
      box-shadow: var(--shadow-sm);
      content-visibility: auto;
      contain-intrinsic-size: 180px;
    }

    .card:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .card-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 0.25rem;
      flex-wrap: wrap;
    }

    .card-title {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .card-name {
      font-weight: 650;
      font-size: 1rem;
      color: var(--text);
      text-decoration: none;
    }

    a.card-name:hover { color: var(--accent); }

    .card-id {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-faint);
    }

    .card-meta {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .tag {
      font-size: 0.75rem;
      font-family: var(--font-mono);
      padding: 0.15rem 0.4rem;
      border-radius: var(--r-sm);
      background: var(--surface-offset);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .card-desc {
      color: var(--text-muted);
      font-size: 0.875rem;
      margin: 0.25rem 0 0.75rem;
    }

    .card-desc:empty { display: none; }

    .cmd-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--surface-offset);
      border-radius: var(--r-sm);
      padding: 0.5rem 0.75rem;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      line-height: 1.4;
      color: var(--text);
      overflow-x: auto;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .cmd-row code {
      flex: 1;
      white-space: nowrap;
    }

    .copy-btn {
      cursor: pointer;
      background: none;
      border: none;
      color: var(--text-faint);
      padding: 0.25rem;
      border-radius: var(--r-sm);
      flex-shrink: 0;
      transition: color 180ms ease;
      min-width: 44px;
      min-height: 44px;
      display: grid;
      place-items: center;
    }

    .copy-btn:hover { color: var(--accent); }
    .copy-btn.copied { color: var(--accent); }

    .toml-link {
      display: inline-block;
      margin-top: 0.5rem;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-faint);
    }

    .toml-link:hover { color: var(--accent); }

    footer {
      margin-top: 2.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--divider);
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    #loading, #error {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
    }

    #error { color: var(--danger); }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
      border-radius: var(--r-sm);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }

      html { scroll-behavior: auto; }
    }

    @media (max-width: 520px) {
      body { padding-top: 1.5rem; }
      .card { padding: 0.9rem 1rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>proto plugins <span class="sep">/</span><span class="owner">tomdavidson</span></h1>
        <p class="sub">TOML schema plugins for <a href="https://moonrepo.dev/proto" target="_blank" rel="noopener noreferrer">proto</a>, a next-generation toolchain manager by <a href="https://moonrepo.dev/" target="_blank" rel="noopener noreferrer">moonrepo</a>.</p>
      </div>
    </header>

    <div id="catalog-meta" class="catalog-meta"></div>
    <div id="loading">Loading catalog…</div>
    <div id="error" hidden></div>
    <main id="plugins"></main>

    <footer>
      <span>
        <a href="./plugins.jsonld">plugins.jsonld</a>
        · <a href="https://github.com/tomdavidson/proto" target="_blank" rel="noopener noreferrer">source</a>
      </span>
      <span id="catalog-date"></span>
    </footer>
  </div>

  <script type="module">
    const iconCopy = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>'
    const iconCheck = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>'

    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))

    const pluginsEl = document.getElementById('plugins')
    const loadingEl = document.getElementById('loading')
    const errorEl = document.getElementById('error')
    const metaEl = document.getElementById('catalog-meta')
    const dateEl = document.getElementById('catalog-date')

    const formatDate = value => {
      const d = new Date(value)
      if (Number.isNaN(d.getTime())) return ''
      return new Intl.DateTimeFormat('en-CA', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      }).format(d)
    }

    const renderPlugin = p => `
      <article class="card">
        <div class="card-head">
          <div class="card-title">
            ${p.projectUrl ? `<a class="card-name" href="${esc(p.projectUrl)}" target="_blank" rel="noopener noreferrer">${esc(p.name)}</a>` : `<span class="card-name">${esc(p.name)}</span>`}
            <span class="card-id">${esc(p.identifier)}</span>
          </div>
          <div class="card-meta">
            ${p.pluginType ? `<span class="tag">${esc(p.pluginType)}</span>` : ''}
            ${(p.operatingSystem || []).map(os => `<span class="tag">${esc(os)}</span>`).join('')}
          </div>
        </div>
        <p class="card-desc">${esc(p.description)}</p>
        <div class="cmd-row">
          <code>${esc(p.addCommand)}</code>
          <button class="copy-btn" type="button" data-cmd="${esc(p.addCommand)}" aria-label="Copy command for ${esc(p.identifier)}">${iconCopy}</button>
        </div>
        <a class="toml-link" href="${esc(p.downloadUrl)}" target="_blank" rel="noopener noreferrer">${esc(p.identifier)}.toml</a>
      </article>
    `

    const wireCopyButtons = () => {
      for (const btn of pluginsEl.querySelectorAll('.copy-btn')) {
        btn.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(btn.dataset.cmd || '')
            btn.classList.add('copied')
            btn.innerHTML = iconCheck
            setTimeout(() => {
              btn.classList.remove('copied')
              btn.innerHTML = iconCopy
            }, 1500)
          } catch {}
        })
      }
    }

    const load = async () => {
      try {
        const res = await fetch('./plugins.jsonld')
        if (!res.ok) throw new Error(`${res.status} ${res.statusText}`)

        const feed = await res.json()
        const plugins = feed.member || feed.plugins || feed.dataFeedElement || []

        loadingEl.hidden = true
        metaEl.textContent = `${plugins.length} plugin${plugins.length === 1 ? '' : 's'}`

        if (feed.dateModified) {
          const label = formatDate(feed.dateModified)
          if (label) dateEl.textContent = `updated ${label}`
        }

        pluginsEl.innerHTML = plugins.map(renderPlugin).join('')
        wireCopyButtons()
      } catch (e) {
        loadingEl.hidden = true
        errorEl.hidden = false
        errorEl.textContent = `Failed to load plugins.jsonld: ${e.message}`
      }
    }

    load()
  </script>
</body>
</html>
