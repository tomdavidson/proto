<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>proto plugins — tomdavidson</title>
    <meta name="description" content="Non-WASM plugins for proto">
    <style>
    :root {
      --bg: #171614;
      --surface: #1c1b19;
      --surface-offset: #22211f;
      --text: #cdccca;
      --text-muted: #979592;
      --text-faint: #6f6d6a;
      --accent: #4f98a3;
      --accent-hover: #6cb5bf;
      --border: #393836;
      --divider: #2d2c2a;
      --danger: #dd6974;
      --r-sm: 0.375rem;
      --r-md: 0.5rem;
      --font-body:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        "Noto Sans",
        Ubuntu,
        Cantarell,
        "Helvetica Neue",
        Arial,
        sans-serif;
      --font-mono:
        ui-monospace,
        "SFMono-Regular",
        "Cascadia Code",
        "Source Code Pro",
        Menlo,
        Consolas,
        "DejaVu Sans Mono",
        "Liberation Mono",
        monospace;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.22);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-size-adjust: none;
    }

    body {
      min-height: 100dvh;
      font-family: var(--font-body);
      font-size: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
      line-height: 1.6;
      color: var(--text);
      background: var(--bg);
      padding: 2rem 1rem 3rem;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }
    a:hover {
      color: var(--accent-hover);
      text-decoration: underline;
    }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: clamp(1.25rem, 1rem + 1vw, 1.75rem);
      font-weight: 650;
      line-height: 1.2;
      letter-spacing: -0.01em;
    }

    h1 .sep {
      color: var(--text-faint);
      font-weight: 450;
      margin: 0 0.25rem;
    }
    h1 .owner {
      color: var(--text-muted);
      font-weight: 450;
    }

    .sub {
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-top: 0.25rem;
    }

    .catalog-meta {
      font-size: 0.75rem;
      color: var(--text-faint);
      margin-bottom: 1.5rem;
    }

    #plugins {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: 1rem 1.25rem;
      transition: border-color 180ms ease, transform 180ms ease;
      box-shadow: var(--shadow-sm);
    }

    .card:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .card-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 0.25rem;
      flex-wrap: wrap;
    }

    .card-title {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .card-name {
      font-weight: 650;
      font-size: 1rem;
      color: var(--text);
    }

    a.card-name:hover {
      color: var(--accent);
    }

    .card-id {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-faint);
    }

    .card-meta {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .tag {
      font-size: 0.75rem;
      font-family: var(--font-mono);
      padding: 0.15rem 0.4rem;
      border-radius: var(--r-sm);
      background: var(--surface-offset);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .card-desc {
      color: var(--text-muted);
      font-size: 0.875rem;
      margin: 0.25rem 0 0.75rem;
    }

    .card-desc:empty {
      display: none;
    }

    .cmd-rows {
      display: flex;
      flex-direction: column;
      gap: 0.375rem;
    }

    .cmd-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--surface-offset);
      border-radius: var(--r-sm);
      padding: 0.5rem 0.75rem;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      line-height: 1.4;
      color: var(--text);
      overflow-x: auto;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .cmd-row code {
      flex: 1;
      white-space: nowrap;
    }

    .copy-btn {
      cursor: pointer;
      background: none;
      border: none;
      color: var(--text-faint);
      padding: 0.25rem;
      border-radius: var(--r-sm);
      flex-shrink: 0;
      transition: color 180ms ease;
      min-width: 44px;
      min-height: 44px;
      display: grid;
      place-items: center;
    }

    .copy-btn:hover {
      color: var(--accent);
    }

    .plugin-file-link {
      display: inline-block;
      margin-top: 0.5rem;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-faint);
    }

    .plugin-file-link:hover {
      color: var(--accent);
    }

    footer {
      margin-top: 2.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--divider);
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    #loading, #error {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
    }

    #error {
      color: var(--danger);
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
      border-radius: var(--r-sm);
    }

    @media (prefers-reduced-motion: reduce) {
      .card {
        transition: none;
      }
      .card:hover {
        transform: none;
      }
    }

    @media (max-width: 520px) {
      body {
        padding-top: 1.5rem;
      }
      .card {
        padding: 0.9rem 1rem;
      }
    }

    svg {
      display: block;
    }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div>
          <h1>
            proto plugins <span class="sep">/</span>
            <span class="owner">tomdavidson</span>
          </h1>
          <p class="sub">
            Non-WASM plugins for <a
              href="https://moonrepo.dev/proto"
              target="_blank"
              rel="noopener noreferrer"
            >proto</a>, a next-generation toolchain manager by <a
              href="https://moonrepo.dev/"
              target="_blank"
              rel="noopener noreferrer"
            >moonrepo</a>.
          </p>
        </div>
      </header>

      <div id="catalog-meta" class="catalog-meta"></div>
      <div id="loading">Loading catalog…</div>
      <div id="error" hidden></div>
      <main id="plugins"></main>

      <footer>
        <span>
          <a href="./plugins.jsonld">plugins.jsonld</a>
          · <a href="./schema/proto-plugin.schema.json">schema</a>
          · <a href="https://github.com/tomdavidson/proto" target="_blank" rel="noopener noreferrer"
          >source</a>
        </span>
        <span id="catalog-date"></span>
      </footer>
    </div>

    <template id="icon-copy"><svg
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <rect x="9" y="9" width="13" height="13" rx="2" />
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
      </svg></template>
    <template id="icon-check"><svg
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <polyline points="20 6 9 17 4 12" />
      </svg></template>

    <script>
    const COPY_RESET_MS = 1500

      const pluginsEl = document.getElementById('plugins')
      const loadingEl = document.getElementById('loading')
      const errorEl = document.getElementById('error')
      const metaEl = document.getElementById('catalog-meta')
      const dateEl = document.getElementById('catalog-date')
      const iconCopyTpl = document.getElementById('icon-copy')
      const iconCheckTpl = document.getElementById('icon-check')

      const copyTimers = new WeakMap()

      const iconNode = tpl => tpl.content.firstElementChild.cloneNode(true)

      const setIcon = (btn, tpl) => btn.replaceChildren(iconNode(tpl))

      const formatDate = value => {
        const d = new Date(value)
        return Number.isNaN(d.getTime()) ? '' : d.toISOString().slice(0, 10)
      }

      const makeEl = (tag, className, text) => {
        const el = document.createElement(tag)
        if (className) el.className = className
        if (text != null) el.textContent = text
        return el
      }

      const stripProto = value =>
        typeof value === 'string' ? value.replace(/^proto:/, '') : ''

      const pluginFileUrl = plugin =>
        plugin.pluginFile || plugin.downloadUrl || plugin.url || '#'

      const pluginFileName = plugin => {
        const url = pluginFileUrl(plugin)
        try {
          return new URL(url).pathname.split('/').pop() || `${plugin.identifier ?? 'plugin'}`
        } catch {
          return url.split('/').pop() || `${plugin.identifier ?? 'plugin'}`
        }
      }

      const makeNameNode = plugin => {
        const name = plugin.name ?? plugin.identifier ?? ''
        if (!plugin.projectUrl) return makeEl('span', 'card-name', name)
        const a = makeEl('a', 'card-name', name)
        a.href = plugin.projectUrl
        a.target = '_blank'
        a.rel = 'noopener noreferrer'
        return a
      }

      const makeMetaNode = plugin => {
        const host = makeEl('div', 'card-meta')
        const pluginType = stripProto(plugin.pluginType)
        if (pluginType) host.append(makeEl('span', 'tag', pluginType))
        const osList = Array.isArray(plugin.operatingSystem) ? plugin.operatingSystem : []
        for (const os of osList) host.append(makeEl('span', 'tag', os))
        return host
      }

      const makeCopyButton = (cmd, label) => {
        const btn = makeEl('button', 'copy-btn')
        btn.type = 'button'
        btn.dataset.cmd = cmd
        btn.setAttribute('aria-label', label)
        setIcon(btn, iconCopyTpl)
        return btn
      }

      const makeCmdRow = (cmd, ariaLabel) => {
        const row = makeEl('div', 'cmd-row')
        row.append(makeEl('code', '', cmd), makeCopyButton(cmd, ariaLabel))
        return row
      }

      const makeAddRow = plugin =>
        makeCmdRow(
          plugin.addCommand ?? '',
          `Copy add command for ${plugin.identifier ?? ''}`,
        )

      const makeInstallRow = plugin =>
        makeCmdRow(
          plugin.installCommand ?? '',
          `Copy install command for ${plugin.identifier ?? ''}`,
        )

      const makePluginFileLink = plugin => {
        const link = makeEl('a', 'plugin-file-link', pluginFileName(plugin))
        link.href = pluginFileUrl(plugin)
        link.target = '_blank'
        link.rel = 'noopener noreferrer'
        return link
      }

      const makeHead = plugin => {
        const head = makeEl('div', 'card-head')
        const title = makeEl('div', 'card-title')
        title.append(makeNameNode(plugin), makeEl('span', 'card-id', plugin.identifier ?? ''))
        head.append(title, makeMetaNode(plugin))
        return head
      }

      const buildCard = plugin => {
        const card = makeEl('article', 'card')
        const cmdRows = makeEl('div', 'cmd-rows')
        cmdRows.append(makeAddRow(plugin), makeInstallRow(plugin))
        card.append(
          makeHead(plugin),
          makeEl('p', 'card-desc', plugin.description ?? ''),
          cmdRows,
          makePluginFileLink(plugin),
        )
        return card
      }

      const resetCopyIcon = btn => {
        setIcon(btn, iconCopyTpl)
        copyTimers.delete(btn)
      }

      const markCopied = btn => {
        setIcon(btn, iconCheckTpl)
        const prev = copyTimers.get(btn)
        if (prev) clearTimeout(prev)
        copyTimers.set(btn, setTimeout(() => resetCopyIcon(btn), COPY_RESET_MS))
      }

      const onCopyClick = btn => {
        const cmd = btn.dataset.cmd || ''
        if (!cmd) return
        navigator.clipboard.writeText(cmd).then(() => markCopied(btn)).catch(() => {})
      }

      pluginsEl.addEventListener('click', event => {
        const btn = event.target.closest('.copy-btn')
        if (btn) onCopyClick(btn)
      })

      const render = feed => {
        const plugins = feed.plugins ?? []
        loadingEl.hidden = true
        const count = `${plugins.length} plugin${plugins.length === 1 ? '' : 's'}`
        metaEl.textContent = feed.description ? `${count} · ${feed.description}` : count
        const label = formatDate(feed.dateModified)
        if (label) dateEl.textContent = `updated ${label}`
        const frag = document.createDocumentFragment()
        for (const p of plugins) frag.append(buildCard(p))
        pluginsEl.replaceChildren(frag)
      }

      const showError = message => {
        loadingEl.hidden = true
        errorEl.hidden = false
        errorEl.textContent = `Failed to load plugins.jsonld: ${message}`
      }

      fetch('./plugins.jsonld').then(res =>
        res.ok ? res.json() : Promise.reject(new Error(`${res.status} ${res.statusText}`))
      ).then(render).catch(e => showError(e?.message ?? String(e)))
    </script>
  </body>
</html>
