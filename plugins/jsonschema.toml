name = "jsonschema"
type = "cli"
description = "Fast JSON Schema validator with a CLI — supports drafts 4, 6, 7, 2019-09, and 2020-12"

[platform.linux]
download-file = "jsonschema-cli-{arch}-unknown-linux-gnu.tar.gz"
exe-path = "jsonschema-cli"

[platform.macos]
download-file = "jsonschema-cli-{arch}-apple-darwin.tar.gz"
exe-path = "jsonschema-cli"

[platform.windows]
download-file = "jsonschema-cli-{arch}-pc-windows-msvc.zip"
exe-path = "jsonschema-cli.exe"

[install]
download-url = "https://github.com/Stranger6667/jsonschema/releases/download/cli-v{version}/{download_file}"

[install.arch]
x86_64  = "x86_64"
aarch64 = "aarch64"

[resolve]
git-url         = "https://github.com/Stranger6667/jsonschema"
git-tag-pattern = "^cli-v(?<major>\\d+)\\.(?<minor>\\d+)\\.(?<patch>\\d+)"
